name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d campusconnect_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusconnect_test?schema=public
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusconnect_test
      TEST_RUNTIME_DATABASE_URL: postgresql://campusconnect_runtime:test_only_password@localhost:5432/campusconnect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Provision runtime role before migration
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/admin/create-runtime-role.sql
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/admin/create-runtime-role.sql
      - run: npx prisma migrate deploy
      - name: Grant runtime permissions and enable isolated test login
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/admin/grant-runtime-role.sql
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE campusconnect_runtime LOGIN PASSWORD 'test_only_password'"
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Record audit
        run: |
          npm audit --json > npm-audit.json || test "$?" = 1
          node -e "const a=require('./npm-audit.json'); if(a.error || !a.metadata?.vulnerabilities) process.exit(1); console.log(a.metadata.vulnerabilities)"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
